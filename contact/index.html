<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Julia Lizak</title>
  <meta name="description" content="Get in touch with Julia Lizak.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="site-logo" href="/"><img class="site-logo__mark" src="/media/final-signature-short.png" alt="Julia Lizak"></a>
      <button class="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="primary-nav">
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
      </button>
      <nav class="site-nav" id="primary-nav" aria-label="Primary">
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/work/">Work</a></li>
          <li><a href="/projects/">Projects</a></li>
          <li><a href="/about/">About</a></li>
          <li><a href="/golf/">Golf</a></li>
          <li><a href="/contact/" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section container">
      <div class="contact-grid">
        <div>
          <h1 class="contact__title">Let's Connect!</h1>
          <p class="contact__text">
            Interested in collaborating or have a question? I'd love to hear
            from you — fill out the form and I'll get back to you soon.
          </p>
        </div>

        <form id="contact-form" class="contact-form" novalidate>
          <input type="hidden" name="access_key" value="19642ddf-26c1-4b4a-a029-1e8f820454ff">
          <input type="hidden" name="subject" value="New message from your portfolio site">
          <input type="checkbox" name="botcheck" class="contact-form__honeypot" tabindex="-1" autocomplete="off">

          <div class="contact-form__field">
            <label for="contact-name">Name *</label>
            <input type="text" id="contact-name" name="name" placeholder="Your name" required>
          </div>

          <div class="contact-form__field">
            <label for="contact-email">Email *</label>
            <input type="email" id="contact-email" name="email" placeholder="you@email.com" required>
          </div>

          <div class="contact-form__field">
            <label for="contact-company">Company</label>
            <input type="text" id="contact-company" name="company" placeholder="Where you're reaching out from">
          </div>

          <div class="contact-form__field">
            <label for="contact-phone">Phone Number</label>
            <input type="tel" id="contact-phone" name="phone" placeholder="(123) 456-7890">
          </div>

          <div class="contact-form__field">
            <label for="contact-message">Message *</label>
            <textarea id="contact-message" name="message" placeholder="What's on your mind?" required></textarea>
          </div>

          <button type="submit" class="contact-form__submit">Send <span aria-hidden="true">&rarr;</span></button>
          <p id="contact-form-status" class="contact-form__status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="current-year"></span> Julia Lizak</p>
      <nav aria-label="Footer">
        <ul>
          <li><a href="/work/">Work</a></li>
          <li><a href="/projects/">Projects</a></li>
          <li><a href="/about/">About</a></li>
          <li><a href="/golf/">Golf</a></li>
          <li><a href="/contact/">Contact</a></li>
        </ul>
      </nav>
    </div>
  </footer>

  <script src="/js/main.js"></script>
</body>
</html>
